<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<meta name="theme-color" content="#245D39" />
<title>Famiminmax — Minimums rayon</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📦</text></svg>" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
  /* ---- Charte graphique Famiflora : donkergroen #245D39 / lichtgroen #80BA27, Rubik ---- */
  :root{
    --donkergroen:#245D39;--lichtgroen:#80BA27;--lichtgroen-bg:#E6F0D7;
    --bg:var(--lichtgroen-bg);--card:#fff;--card-2:#fbfdf6;
    --ink:var(--donkergroen);--ink-soft:#5c7a67;
    --rouge:#c1465a;--rouge-bg:#ffe4e3;
    --bord:#c9dab3;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:"Rubik",system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.45;
    -webkit-tap-highlight-color:transparent}
  header{background:var(--donkergroen);color:#fff;padding:10px 14px;display:flex;align-items:baseline;gap:10px;
    position:sticky;top:0;z-index:10}
  header h1{font-size:19px;font-weight:800;letter-spacing:.03em;text-transform:uppercase;margin:0}
  header .sous{font-size:12px;color:#cfe6a0;font-weight:500}
  #chipUser{margin-left:auto;font:inherit;font-size:12.5px;font-weight:600;cursor:pointer;
    background:#1a4a2c;color:#cfe6a0;border:1.5px solid var(--lichtgroen);border-radius:99px;padding:5px 12px}
  #lienPortail{color:#cfe6a0;font-size:12.5px;font-weight:600;text-decoration:none;white-space:nowrap}
  main{max-width:560px;margin:0 auto;padding:12px 12px 90px}

  /* Zone scan */
  .scan{display:flex;gap:8px;margin-bottom:12px}
  .scan input{flex:1;font:inherit;font-size:18px;font-weight:500;padding:13px 14px;border-radius:12px;
    border:2px solid var(--bord);background:#fff;color:var(--ink);min-width:0}
  .scan input:focus{outline:none;border-color:var(--lichtgroen);box-shadow:0 0 0 3px #cfe6a066}
  .scan button{font:inherit;font-size:20px;padding:0 16px;border-radius:12px;border:2px solid var(--bord);
    background:#fff;color:var(--ink);cursor:pointer}
  .scan button.actif{background:var(--lichtgroen);border-color:var(--donkergroen);color:#12321f}

  .msg{padding:12px 14px;border-radius:12px;font-size:15px;margin-bottom:12px}
  .msg.err{background:var(--rouge-bg);border:2px solid var(--rouge);color:#9c3547;font-weight:500}
  .msg.info{background:#fff;border:2px solid var(--bord);color:var(--ink-soft)}

  /* Choix multi-produits */
  .choix button{display:block;width:100%;text-align:left;font:inherit;padding:12px 14px;margin-bottom:8px;
    border-radius:12px;border:2px solid var(--bord);background:#fff;cursor:pointer}
  .choix .code{font-size:12px;color:var(--ink-soft)}

  /* Fiche produit */
  .fiche{background:var(--card);border:2px solid var(--bord);border-radius:16px;padding:16px;margin-bottom:12px}
  .fiche h2{margin:0 0 2px;font-size:19px;font-weight:700;line-height:1.25}
  .fiche .ref{font-size:12.5px;color:var(--ink-soft);margin-bottom:12px}
  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:6px}
  .stat{background:var(--card-2);border:1.5px solid var(--bord);border-radius:12px;padding:8px 6px;text-align:center}
  .stat b{display:block;font-size:22px;font-weight:800;line-height:1.15}
  .stat span{font-size:10.5px;color:var(--ink-soft);font-weight:500;text-transform:uppercase;letter-spacing:.04em}
  .stat.min{background:var(--donkergroen);border-color:var(--donkergroen)}
  .stat.min b{color:#fff}
  .stat.min span{color:#cfe6a0}
  .stat.alerte{background:var(--rouge-bg);border-color:var(--rouge)}
  .stat.alerte b{color:#9c3547}
  .contexte{font-size:12.5px;color:var(--ink-soft);margin:6px 2px 0}
  .badge-inactif{display:inline-block;vertical-align:middle;margin-left:8px;font-size:11px;font-weight:700;
    letter-spacing:.04em;text-transform:uppercase;padding:2px 9px;border-radius:99px;
    background:var(--rouge-bg);color:#9c3547;border:1.5px solid var(--rouge)}
  .badge-actif{display:inline-block;vertical-align:middle;margin-left:8px;font-size:11px;font-weight:600;
    letter-spacing:.04em;text-transform:uppercase;padding:2px 9px;border-radius:99px;
    background:var(--lichtgroen-bg);color:var(--donkergroen);border:1.5px solid var(--lichtgroen)}

  /* Graphique ventes */
  .ventes{background:var(--card);border:2px solid var(--bord);border-radius:16px;padding:14px 16px;margin-bottom:12px}
  .ventes h3{margin:0 0 10px;font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-soft)}
  .graph{display:flex;align-items:flex-end;gap:8px;height:110px}
  .col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%}
  .col .val{font-size:13px;font-weight:700;margin-bottom:3px}
  .col .tot{font-size:9.5px;color:var(--ink-soft)}
  .col .barre{width:100%;max-width:44px;background:linear-gradient(180deg,var(--lichtgroen),#96c93f);
    border:1.5px solid var(--donkergroen);border-radius:6px 6px 0 0;min-height:3px}
  .col.vide .barre{background:#eef3e4;border-color:var(--bord)}
  .col .sem{font-size:10.5px;color:var(--ink-soft);margin-top:5px;font-weight:500;text-align:center;line-height:1.2}
  .ventes .aucune{color:var(--ink-soft);font-size:13.5px}

  /* Proposition */
  .proposer{background:var(--card);border:2px solid var(--bord);border-radius:16px;padding:16px;margin-bottom:12px}
  .proposer h3{margin:0 0 10px;font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-soft)}
  .encours{background:var(--lichtgroen-bg);border:1.5px solid var(--lichtgroen);border-radius:10px;
    padding:9px 12px;font-size:13.5px;margin-bottom:12px}
  .encours.refus{background:var(--rouge-bg);border-color:var(--rouge);color:#9c3547}
  .encours.attente{background:#fdf6e3;border-color:#e6d3a0;color:#5c4a1a}
  .aide{font-size:12.5px;color:var(--ink-soft);margin:-4px 0 10px}
  .collec-actuelle{font-size:14px;margin:0 0 10px}
  .collec-actuelle b{font-size:16px}
  .stepper{display:flex;align-items:center;gap:10px;margin-bottom:12px}
  .stepper button{width:56px;height:56px;font-size:28px;font-weight:700;border-radius:14px;cursor:pointer;
    border:2px solid var(--donkergroen);background:#fff;color:var(--donkergroen)}
  .stepper button:active{background:var(--lichtgroen-bg)}
  .stepper input{flex:1;text-align:center;font-family:inherit;font-size:30px;font-weight:800;padding:8px;
    border-radius:14px;border:2px solid var(--bord);color:var(--ink);min-width:0}
  .proposer textarea,.proposer .auteur{width:100%;font:inherit;font-size:15px;padding:10px 12px;border-radius:10px;
    border:2px solid var(--bord);background:#fff;color:var(--ink);margin-bottom:10px}
  .proposer textarea{resize:none;height:64px}
  .btn-valider{width:100%;font:inherit;font-size:17px;font-weight:700;padding:15px;border-radius:14px;cursor:pointer;
    background:linear-gradient(180deg,#96c93f 0%,var(--lichtgroen) 70%,var(--donkergroen) 100%);
    color:#12321f;border:2px solid var(--donkergroen);box-shadow:3px 3px 0 var(--donkergroen)}
  .btn-valider:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--donkergroen)}
  .btn-valider:disabled{opacity:.55}

  /* Identification : page nom au premier accès, session 30 min glissantes */
  #voileNom{position:fixed;inset:0;z-index:45;background:rgba(18,50,31,.55);display:flex;align-items:center;justify-content:center;padding:18px}
  #voileNom[hidden]{display:none}
  .carte-nom{background:#fff;border-radius:18px;padding:20px;width:100%;max-width:380px}
  .carte-nom h3{margin:0 0 6px;font-size:18px;font-weight:700}
  .carte-nom p{margin:0 0 12px;font-size:12.5px;color:var(--ink-soft)}
  .carte-nom input{width:100%;font:inherit;font-size:17px;padding:12px;border-radius:11px;border:2px solid var(--bord);margin-bottom:12px}
  .carte-nom input:focus{outline:none;border-color:var(--lichtgroen)}

  /* Sélecteur de collection plein écran (le datalist natif est inutilisable sur TC26) */
  #voileColl{position:fixed;inset:0;z-index:40;background:rgba(18,50,31,.45);display:flex;align-items:flex-end}
  #voileColl[hidden]{display:none}
  .picker{background:#fff;border-radius:18px 18px 0 0;width:100%;max-height:86vh;display:flex;flex-direction:column;padding:12px}
  .picker-tete{display:flex;gap:8px;margin-bottom:10px}
  .picker-tete input{flex:1;font:inherit;font-size:16px;padding:11px 13px;border-radius:11px;border:2px solid var(--bord);min-width:0}
  .picker-tete input:focus{outline:none;border-color:var(--lichtgroen)}
  .picker-tete button{font-size:18px;padding:0 14px;border-radius:11px;border:2px solid var(--bord);background:#fff;color:var(--ink);cursor:pointer}
  .picker-liste{overflow-y:auto;-webkit-overflow-scrolling:touch}
  .picker-liste button{display:block;width:100%;text-align:left;font:inherit;font-size:15px;padding:13px 14px;cursor:pointer;
    border:none;border-bottom:1px solid #edf3e4;background:#fff;color:var(--ink)}
  .picker-liste button:active{background:var(--lichtgroen-bg)}
  .picker-liste .aucun{padding:14px;color:var(--ink-soft);font-size:14px}
  .btn-choix{width:100%;font:inherit;font-size:15.5px;font-weight:600;padding:13px 14px;border-radius:12px;cursor:pointer;
    background:#fff;color:var(--ink);border:2px dashed var(--bord);margin-bottom:10px;text-align:left}
  .btn-choix.rempli{border-style:solid;border-color:var(--lichtgroen);background:var(--lichtgroen-bg)}

  /* Toast */
  #toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%) translateY(90px);z-index:50;
    background:var(--donkergroen);color:#fff;font-weight:600;font-size:15px;padding:13px 22px;border-radius:14px;
    transition:transform .25s;max-width:92vw;text-align:center}
  #toast.visible{transform:translateX(-50%) translateY(0)}
  #toast.err{background:var(--rouge)}
</style>
</head>
<body>
<header>
  <a id="lienPortail" href="https://famiportail.famiformation.com" hidden>← Famiportail</a>
  <h1>Famiminmax</h1>
  <span class="sous">Minimums rayon</span>
  <button type="button" id="chipUser" hidden>👤 —</button>
</header>
<main>
  <form class="scan" id="formScan" autocomplete="off">
    <input id="champScan" inputmode="none" placeholder="Scannez un code-barres…" autofocus
      autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" />
    <button type="button" id="btnClavier" title="Saisie manuelle">⌨</button>
  </form>
  <div id="zone">
    <p class="msg info">Scannez l'étiquette d'un produit pour afficher son minimum rayon et ses ventes des 5 dernières semaines.</p>
  </div>
</main>
<div id="voileNom" hidden>
  <div class="carte-nom">
    <h3>👤 Qui êtes-vous ?</h3>
    <p>Votre nom signera vos propositions. Il reste actif 30 minutes après votre dernière action sur cet appareil.</p>
    <input id="champNom" maxlength="80" placeholder="Votre nom" autocomplete="off" />
    <button class="btn-valider" id="validerNom">C'est parti</button>
  </div>
</div>
<div id="voileColl" hidden>
  <div class="picker">
    <div class="picker-tete">
      <input id="rechColl" placeholder="Rechercher une collection…" autocomplete="off" />
      <button type="button" id="fermerColl">✕</button>
    </div>
    <div class="picker-liste" id="listeCollUI"></div>
  </div>
</div>
<div id="toast"></div>

<script>
'use strict';
const champ = document.getElementById('champScan');
const zone = document.getElementById('zone');
const toastEl = document.getElementById('toast');
let toastTimer = null;

function toast(msg, err) {
  toastEl.textContent = msg;
  toastEl.className = 'visible' + (err ? ' err' : '');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { toastEl.className = ''; }, 2600);
}

function ech(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, (c) =>
    ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

// Le TC26 scanne en mode clavier : on garde le focus sur le champ,
// clavier virtuel masqué par défaut (bouton ⌨ pour la saisie manuelle).
const btnClavier = document.getElementById('btnClavier');
btnClavier.addEventListener('click', () => {
  const manuel = champ.getAttribute('inputmode') === 'none';
  champ.setAttribute('inputmode', manuel ? 'text' : 'none');
  btnClavier.classList.toggle('actif', manuel);
  champ.blur(); champ.focus();
});
function refocus() { setTimeout(() => { champ.focus(); champ.select(); }, 60); }
document.addEventListener('visibilitychange', () => { if (!document.hidden) refocus(); });

document.getElementById('formScan').addEventListener('submit', (e) => {
  e.preventDefault();
  const code = champ.value.trim();
  if (code) chercher(code);
});

// Filet de sécurité kiosk : certains navigateurs bridés font perdre le focus
// au champ de scan, et les touches injectées par DataWedge partent dans le
// vide. On les capte au niveau du document et on les re-route vers le champ.
// La saisie normale dans un autre champ (nom, recherche collection…) n'est
// pas touchée.
document.addEventListener('keydown', (e) => {
  if (e.ctrlKey || e.altKey || e.metaKey) return;
  const t = e.target;
  if (t instanceof HTMLInputElement || t instanceof HTMLTextAreaElement) return;
  if (e.key === 'Enter') {
    const code = champ.value.trim();
    if (!code) return; // Entrée sans scan en cours : comportement normal
    e.preventDefault();
    champ.value = '';
    chercher(code);
    return;
  }
  if (e.key.length === 1) {
    e.preventDefault();
    champ.value += e.key;
  }
});

// Collections proposables : filtrées par famille du produit scanné
// (pas de collection Noël sur un produit d'automne). Cache par famille.
let listeCollections = [];
const cacheCollections = {};
async function chargerCollections(famille) {
  const cle = famille || '*';
  if (cacheCollections[cle]) { listeCollections = cacheCollections[cle]; return; }
  try {
    const rep = await fetch('/api/collections' + (famille ? '?famille=' + encodeURIComponent(famille) : ''));
    cacheCollections[cle] = (await rep.json()).collections || [];
  } catch {
    cacheCollections[cle] = [];
  }
  listeCollections = cacheCollections[cle];
}

// Bannière d'état d'une demande : validée d'office, l'acheteur peut refuser.
function banniereStatut(prop, resume) {
  const s = prop.statut || 'validee';
  if (s === 'refusee') {
    return '<div class="encours refus">✗ ' + resume + ' — <b>refusée par l\'acheteur</b>' +
      (prop.motifRefus ? ' : ' + ech(prop.motifRefus) : '') + '<br>Vous pouvez faire une nouvelle proposition.</div>';
  }
  if (s === 'traitee') return '<div class="encours">✓ ' + resume + ' — <b>traitée</b>, adaptée dans l\'ERP.</div>';
  return '<div class="encours">✓ ' + resume + ' — <b>enregistrée</b>, sera transmise à l\'ERP au prochain export.</div>';
}

async function chercher(code) {
  zone.innerHTML = '<p class="msg info">Recherche…</p>';
  try {
    const rep = await fetch('/api/produit?code=' + encodeURIComponent(code));
    const data = await rep.json();
    if (!rep.ok) { zone.innerHTML = '<p class="msg err">' + ech(data.erreur) + '</p>'; refocus(); return; }
    if (data.choix) { afficherChoix(data.choix); refocus(); return; }
    await chargerCollections(data.produit.famille);
    afficherFiche(data);
    prolongerSession();
  } catch {
    zone.innerHTML = '<p class="msg err">Serveur injoignable. Vérifiez le réseau et réessayez.</p>';
  }
  refocus();
}

function afficherChoix(choix) {
  zone.innerHTML = '<p class="msg info">Plusieurs produits partagent ce code-barres :</p><div class="choix">' +
    choix.map((c) =>
      '<button data-code="' + ech(c.codeArticle) + '"><b>' + ech(c.description) + '</b><br>' +
      '<span class="code">Article ' + ech(c.codeArticle) + ' · EAN ' + ech(c.ean) + '</span></button>'
    ).join('') + '</div>';
  zone.querySelectorAll('.choix button').forEach((b) =>
    b.addEventListener('click', () => chercher(b.dataset.code)));
}

function libSemaine(iso) {
  const d = new Date(iso + 'T12:00:00');
  const fin = new Date(d); fin.setDate(fin.getDate() + 6);
  const f = (x) => String(x.getDate()).padStart(2, '0') + '/' + String(x.getMonth() + 1).padStart(2, '0');
  return f(d) + '<br>au ' + f(fin);
}

function afficherFiche(data) {
  const p = data.produit;
  const maxV = Math.max(1, ...data.ventes.map((v) => v.qteFami));
  const stockAlerte = p.stock < p.stockMin;

  let graph;
  if (!data.ventes.length) {
    graph = '<p class="aucune">Aucune semaine de ventes importée pour le moment.</p>';
  } else {
    graph = '<div class="graph">' + data.ventes.map((v) => {
      const h = Math.max(3, Math.round((v.qteFami / maxV) * 72));
      const tot = v.qteTotale !== v.qteFami ? '<span class="tot">tot. ' + v.qteTotale + '</span>' : '';
      return '<div class="col' + (v.qteFami === 0 ? ' vide' : '') + '">' +
        '<span class="val">' + v.qteFami + '</span>' + tot +
        '<div class="barre" style="height:' + h + 'px"></div>' +
        '<span class="sem">' + libSemaine(v.semaine) + '</span></div>';
    }).join('') + '</div>';
  }

  // Article inactif sans aucun stock dépôt : fin de vie, proposition désactivée
  const bloque = p.actif === false &&
    ((p.stockDepot || 0) + (p.stockDepot2 || 0) + (p.stockFdcm || 0)) === 0;

  const prop = data.proposition;
  const valeurInitiale = prop ? prop.minPropose : p.stockMin;
  const enCours = prop
    ? banniereStatut(prop, 'Min proposé : <b>' + prop.minPropose + '</b>' +
        (prop.auteur ? ' (par ' + ech(prop.auteur) + ')' : ''))
    : '';

  const propColl = data.propositionCollection;
  const enCoursColl = propColl
    ? banniereStatut(propColl, 'Collection proposée : <b>' + ech(propColl.collectionProposee) + '</b>' +
        (propColl.auteur ? ' (par ' + ech(propColl.auteur) + ')' : ''))
    : '';
  const blocCollection = (data.collection != null || listeCollections.length)
    ? '<div class="proposer"><h3>Collection</h3>' +
      '<p class="collec-actuelle">Collection actuelle : <b>' + (data.collection ? ech(data.collection) : '—') + '</b></p>' +
      enCoursColl +
      (listeCollections.length
        ? '<button type="button" class="btn-choix" id="ouvrirColl">Choisir la nouvelle collection…</button>' +
          '<button class="btn-valider" id="validerColl" disabled>Proposer le changement de collection</button>'
        : '<p class="aide">Liste des collections indisponible — importez le fichier collections dans l\'admin.</p>') +
      '</div>'
    : '';

  const badge = p.actif === false
    ? '<span class="badge-inactif">inactif</span>'
    : '<span class="badge-actif">actif</span>';
  const depots = [];
  if (p.stockDepot != null) depots.push('Dépôt : <b>' + p.stockDepot + '</b>');
  if (p.stockDepot2 != null) depots.push('Dépôt 2 : <b>' + p.stockDepot2 + '</b>');
  if (p.stockFdcm != null) depots.push('FDCM : <b>' + p.stockFdcm + '</b>');

  zone.innerHTML =
    '<div class="fiche">' +
      '<h2>' + ech(p.description) + badge + '</h2>' +
      '<div class="ref">Article ' + ech(p.codeArticle) + ' · EAN ' + ech(p.ean || '—') +
        (p.famille ? ' · ' + ech(p.famille) : '') +
        (p.fournisseur ? ' · ' + ech(p.fournisseur) : '') + '</div>' +
      '<div class="stats">' +
        '<div class="stat min"><b>' + p.stockMin + '</b><span>Min rayon</span></div>' +
        '<div class="stat' + (stockAlerte ? ' alerte' : '') + '"><b>' + p.stock + '</b><span>Stock</span></div>' +
        '<div class="stat"><b>' + (p.vpe == null ? '—' : p.vpe) + '</b><span>VPE</span></div>' +
      '</div>' +
      (depots.length ? '<p class="contexte">Stock dépôt — ' + depots.join(' · ') + '</p>' : '') +
      (p.vk12 != null ? '<p class="contexte">Ventes 12 derniers mois (VK-12) : <b>' + p.vk12 + '</b></p>' : '') +
    '</div>' +
    '<div class="ventes"><h3>Ventes Fami · 5 dernières semaines</h3>' + graph + '</div>' +
    (bloque
      ? '<div class="proposer"><h3>Proposition désactivée</h3>' +
        '<p class="msg info" style="margin:0">Article <b>inactif</b> sans stock dépôt : il est en fin de vie, son minimum rayon ne doit plus être adapté.</p></div>'
      : '<div class="proposer"><h3>Proposer une adaptation du minimum</h3>' +
      '<p class="aide">Le minimum = la <b>capacité du rayon plein</b> : indiquez combien de pièces tiennent dans le rayon.</p>' +
      enCours +
      '<div class="stepper">' +
        '<button type="button" id="moins">−</button>' +
        '<input id="nouveauMin" type="number" min="0" max="100000" step="1" value="' + valeurInitiale + '" />' +
        '<button type="button" id="plus">+</button>' +
      '</div>' +
      '<textarea id="commentaire" maxlength="500" placeholder="Commentaire (facultatif)"></textarea>' +
      '<button class="btn-valider" id="valider">Envoyer la proposition</button>' +
      '</div>') +
    blocCollection;

  brancherCollection(p);
  if (bloque) { refocus(); return; }

  const nouveauMin = document.getElementById('nouveauMin');
  const pas = p.vpe && p.vpe > 1 ? p.vpe : 1;
  document.getElementById('moins').addEventListener('click', () => {
    nouveauMin.value = Math.max(0, (parseInt(nouveauMin.value, 10) || 0) - pas); refocus();
  });
  document.getElementById('plus').addEventListener('click', () => {
    nouveauMin.value = (parseInt(nouveauMin.value, 10) || 0) + pas; refocus();
  });

  document.getElementById('valider').addEventListener('click', async () => {
    const btn = document.getElementById('valider');
    const min = parseInt(nouveauMin.value, 10);
    if (!Number.isInteger(min) || min < 0) { toast('Minimum invalide.', true); return; }
    btn.disabled = true;
    const nom = await identite();
    if (!nom) { btn.disabled = false; toast('Identifiez-vous pour envoyer la proposition.', true); return; }
    try {
      const rep = await fetch('/api/proposition', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          codeArticle: p.codeArticle,
          minPropose: min,
          commentaire: document.getElementById('commentaire').value,
          auteur: nom,
        }),
      });
      const data2 = await rep.json();
      if (!rep.ok) throw new Error(data2.erreur || 'Erreur serveur.');
      toast('✓ Proposition enregistrée : min ' + min);
      prolongerSession();
      chercher(p.codeArticle);
    } catch (e) {
      toast(e.message, true);
      btn.disabled = false;
    }
  });
  refocus();
}

// Sélecteur plein écran avec recherche — utilisé pour les collections (195
// valeurs) et l'identification des collègues ; un menu natif est inutilisable
// sur l'écran du TC26.
function normaliser(s) {
  return String(s).normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
}
let pickerAnnule = null;
function ouvrirPicker(items, placeholder, onPick, onCancel) {
  const voile = document.getElementById('voileColl');
  const liste = document.getElementById('listeCollUI');
  const rech = document.getElementById('rechColl');
  pickerAnnule = onCancel || null;
  function rendre(filtre) {
    const f = normaliser(filtre || '');
    const visibles = items.filter((c) => !f || normaliser(c).includes(f));
    liste.innerHTML = visibles.length
      ? visibles.map((c) => '<button type="button" data-coll="' + ech(c) + '">' + ech(c) + '</button>').join('')
      : '<p class="aucun">Aucun résultat pour « ' + ech(filtre) + ' ».</p>';
    liste.querySelectorAll('button').forEach((b) =>
      b.addEventListener('click', () => { voile.hidden = true; pickerAnnule = null; onPick(b.dataset.coll); }));
  }
  rech.placeholder = placeholder;
  rech.value = '';
  rendre('');
  rech.oninput = () => rendre(rech.value);
  voile.hidden = false;
  setTimeout(() => rech.focus(), 60);
}
document.getElementById('fermerColl').addEventListener('click', () => {
  document.getElementById('voileColl').hidden = true;
  const cb = pickerAnnule;
  pickerAnnule = null;
  if (cb) cb();
  refocus();
});

// --- Identification (session légère sur l'appareil) ---
// Page nom au premier accès, puis le nom reste actif SESSION_MS après la
// dernière action (scan ou proposition). Si une liste de collègues est
// configurée dans l'admin, elle remplace la saisie libre par le sélecteur.
const SESSION_MS = 30 * 60 * 1000; // 30 min glissantes
let listeCollegues = [];
async function chargerCollegues() {
  const moi = chargerMoi(); // en parallèle de la liste
  try {
    const rep = await fetch('/api/collegues');
    listeCollegues = (await rep.json()).collegues || [];
  } catch {
    listeCollegues = [];
  }
  await moi;
  majChip();
  if (!utilisateurActuel()) identite(); // première page : on s'identifie avant le reste
}

// Arrivé par Famiportail (/entrer) : le serveur connaît déjà le nom, signé par
// le portail. Pas de page nom, et c'est ce nom-là qui signe les propositions.
// Sans session portail (Zebra en libre-service), RIEN ne change.
let identitePortail = null;
async function chargerMoi() {
  try {
    const moi = await (await fetch('/api/moi')).json();
    if (!moi || !moi.portail || !moi.nom) return;
    identitePortail = moi.nom;
    const lien = document.getElementById('lienPortail');
    if (moi.portailUrl) lien.href = moi.portailUrl;
    lien.hidden = false;
    document.querySelector('header .sous').hidden = true; // la place du lien sur l'écran du TC26
  } catch { /* réseau, ancien serveur : identification sur l'appareil, comme avant */ }
}
// Laissez-passer refusé par /entrer (périmé, ou lien rouvert depuis l'historique)
if (new URLSearchParams(location.search).get('acces') === 'refuse') {
  zone.innerHTML = '<p class="msg err">Lien du portail expiré ou invalide : repassez par Famiportail.</p>';
  toast('Lien du portail expiré : repassez par Famiportail.', true); // visible même sous la page nom
  try { history.replaceState(null, '', '/'); } catch { /* l'adresse garde ?acces=refuse, sans gravité */ }
}

function utilisateurActuel() {
  if (identitePortail) return identitePortail; // passe avant la liste des collègues
  try {
    const s = JSON.parse(localStorage.getItem('famiminmax_session') || 'null');
    if (s && s.nom && s.expire > Date.now() &&
        (!listeCollegues.length || listeCollegues.includes(s.nom))) return s.nom;
  } catch { /* session illisible = pas de session */ }
  return null;
}
function ouvrirSession(nom) {
  localStorage.setItem('famiminmax_session', JSON.stringify({ nom, expire: Date.now() + SESSION_MS }));
  majChip();
}
function prolongerSession() {
  // Jamais le nom du portail dans la session de l'appareil : après « Changer
  // d'utilisateur », le collègue suivant signerait au nom du précédent.
  if (identitePortail) return;
  const n = utilisateurActuel();
  if (n) ouvrirSession(n);
}
function majChip() {
  const chip = document.getElementById('chipUser');
  chip.hidden = false;
  chip.textContent = '👤 ' + (utilisateurActuel() || 'Identifiez-vous');
}

// Saisie libre du nom (dernier nom de l'appareil pré-rempli : un toucher suffit)
let resolveNom = null;
function demanderNom() {
  return new Promise((resolve) => {
    resolveNom = resolve;
    const champ = document.getElementById('champNom');
    champ.value = localStorage.getItem('famiminmax_auteur') || '';
    document.getElementById('voileNom').hidden = false;
    setTimeout(() => { champ.focus(); champ.select(); }, 60);
  });
}
document.getElementById('validerNom').addEventListener('click', () => {
  const nom = document.getElementById('champNom').value.trim();
  if (!nom) { toast('Indiquez votre nom.', true); return; }
  localStorage.setItem('famiminmax_auteur', nom);
  ouvrirSession(nom);
  document.getElementById('voileNom').hidden = true;
  const r = resolveNom;
  resolveNom = null;
  if (r) r(nom);
  refocus();
});
document.getElementById('champNom').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') document.getElementById('validerNom').click();
});

let chipArme = null;
document.getElementById('chipUser').addEventListener('click', () => {
  if (identitePortail) {
    // Session portail : « Changer d'utilisateur » la ferme (/sortir). Deux
    // touchers, sans boîte de dialogue (souvent bloquée en kiosque).
    if (chipArme) { location.href = '/sortir'; return; }
    document.getElementById('chipUser').textContent = '↻ Changer d’utilisateur ?';
    chipArme = setTimeout(() => { chipArme = null; majChip(); }, 4000);
    refocus();
    return;
  }
  if (listeCollegues.length) {
    ouvrirPicker(listeCollegues, 'Votre nom…', (nom) => { ouvrirSession(nom); refocus(); });
  } else {
    demanderNom();
  }
});

// Nom requis : session en cours, sinon page nom (libre) ou sélecteur (liste).
// Résout le nom, ou null si le collègue referme le sélecteur sans choisir.
function identite() {
  const nom = utilisateurActuel();
  if (nom) return Promise.resolve(nom);
  if (listeCollegues.length) {
    return new Promise((resolve) => {
      ouvrirPicker(listeCollegues, 'Votre nom…', (n) => { ouvrirSession(n); resolve(n); }, () => resolve(null));
    });
  }
  return demanderNom();
}
chargerCollegues();

// Branche le bloc de proposition de changement de collection (s'il est affiché).
function brancherCollection(p) {
  const btn = document.getElementById('validerColl');
  const ouvrir = document.getElementById('ouvrirColl');
  if (!btn || !ouvrir) return;
  let choix = null;
  ouvrir.addEventListener('click', () => ouvrirPicker(listeCollections, 'Rechercher une collection…', (c) => {
    choix = c;
    ouvrir.textContent = c;
    ouvrir.classList.add('rempli');
    btn.disabled = false;
  }));
  btn.addEventListener('click', async () => {
    if (!choix) { toast('Choisissez d’abord une collection.', true); return; }
    btn.disabled = true;
    const nom = await identite();
    if (!nom) { btn.disabled = false; toast('Identifiez-vous pour envoyer la proposition.', true); return; }
    try {
      const rep = await fetch('/api/proposition-collection', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ codeArticle: p.codeArticle, collectionProposee: choix, auteur: nom }),
      });
      const data = await rep.json();
      if (!rep.ok) throw new Error(data.erreur || 'Erreur serveur.');
      toast('✓ Changement de collection proposé : ' + choix);
      prolongerSession();
      chercher(p.codeArticle);
    } catch (e) {
      toast(e.message, true);
      btn.disabled = false;
    }
  });
}
